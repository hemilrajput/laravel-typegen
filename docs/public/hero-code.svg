<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D20"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D20"/>
      <stop offset="50%" stop-color="#3178C6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="card-clip">
      <rect x="20" y="20" width="440" height="320" rx="16"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect x="20" y="20" width="440" height="320" rx="16" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Top accent bar -->
  <rect x="20" y="20" width="440" height="3" rx="1.5" fill="url(#bar-grad)"/>

  <!-- Window chrome -->
  <rect x="20" y="20" width="440" height="36" rx="16" fill="#1e1e2e"/>
  <rect x="20" y="42" width="440" height="14" fill="#1e1e2e"/>

  <!-- Traffic lights -->
  <circle cx="44" cy="38" r="5" fill="#FF5F57"/>
  <circle cx="60" cy="38" r="5" fill="#FFBD2E"/>
  <circle cx="76" cy="38" r="5" fill="#28C840"/>

  <!-- Tab title -->
  <text x="240" y="42" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#6e7191">generated.ts</text>

  <!-- Scrollbar track -->
  <rect x="448" y="60" width="4" height="260" rx="2" fill="#ffffff08"/>
  <rect x="448" y="60" width="4" height="80" rx="2" fill="#FF2D2040"/>

  <!-- Line numbers column -->
  <rect x="20" y="56" width="38" height="284" fill="#191924"/>

  <!-- Code content area -->
  <g clip-path="url(#card-clip)">
    <!-- Line numbers -->
    <text x="50" y="78"  text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">1</text>
    <text x="50" y="96"  text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">2</text>
    <text x="50" y="114" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">3</text>
    <text x="50" y="132" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">4</text>
    <text x="50" y="150" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">5</text>
    <text x="50" y="168" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">6</text>
    <text x="50" y="186" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">7</text>
    <text x="50" y="204" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">8</text>
    <text x="50" y="222" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">9</text>
    <text x="50" y="240" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">10</text>
    <text x="50" y="258" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">11</text>
    <text x="50" y="276" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">12</text>
    <text x="50" y="294" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">13</text>
    <text x="50" y="312" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#404060">14</text>

    <!-- Active line highlight -->
    <rect x="58" y="122" width="390" height="18" fill="#FF2D2012"/>

    <!-- Comment line 1 -->
    <text x="66" y="78" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#636380">// AUTO-GENERATED by laravel-typegen — do not edit</text>

    <!-- Blank line -->

    <!-- export keyword -->
    <text x="66" y="114" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#3178C6">export </text>
    <text x="113" y="114" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#c792ea">interface </text>
    <text x="181" y="114" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#FF6B35">User </text>
    <text x="212" y="114" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">{</text>

    <!-- id field (active/highlighted) -->
    <text x="84" y="132" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#f8f8f2">id</text>
    <text x="98" y="132" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">:</text>
    <text x="108" y="132" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#FF2D20">number</text>
    <text x="158" y="132" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">;</text>

    <!-- name field -->
    <text x="84" y="150" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#f8f8f2">name</text>
    <text x="116" y="150" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">:</text>
    <text x="126" y="150" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#82e0aa">string</text>
    <text x="167" y="150" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">;</text>

    <!-- email field -->
    <text x="84" y="168" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#f8f8f2">email</text>
    <text x="122" y="168" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">:</text>
    <text x="132" y="168" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#82e0aa">string</text>
    <text x="173" y="168" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">;</text>

    <!-- role field with enum type -->
    <text x="84" y="186" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#f8f8f2">role</text>
    <text x="110" y="186" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">:</text>
    <text x="120" y="186" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#FF6B35">UserRole</text>
    <text x="179" y="186" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">;</text>

    <!-- posts field -->
    <text x="84" y="204" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#f8f8f2">posts</text>
    <text x="116" y="204" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">?:</text>
    <text x="130" y="204" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#FF6B35">Post</text>
    <text x="155" y="204" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">[];</text>

    <!-- created_at field -->
    <text x="84" y="222" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#f8f8f2">created_at</text>
    <text x="148" y="222" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">:</text>
    <text x="158" y="222" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#82e0aa">string</text>
    <text x="199" y="222" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">;</text>

    <!-- closing brace -->
    <text x="66" y="240" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">}</text>

    <!-- blank line -->

    <!-- export type UserRole -->
    <text x="66" y="276" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#3178C6">export </text>
    <text x="113" y="276" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#c792ea">type </text>
    <text x="144" y="276" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#FF6B35">UserRole </text>
    <text x="208" y="276" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">=</text>
    <text x="222" y="276" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#f1fa8c">'admin'</text>
    <text x="267" y="276" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191"> |</text>
    <text x="284" y="276" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#f1fa8c">'member'</text>
    <text x="340" y="276" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6e7191">;</text>

    <!-- cursor blink element -->
    <rect x="347" y="264" width="2" height="14" rx="1" fill="#FF2D20" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom gradient fade -->
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d0d14" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0d0d14" stop-opacity="0.7"/>
  </linearGradient>
  <rect x="20" y="280" width="440" height="60" fill="url(#fade)" rx="0"/>

  <!-- Corner glow -->
  <circle cx="440" cy="340" r="80" fill="#FF2D20" opacity="0.04"/>
  <circle cx="50"  cy="80"  r="60" fill="#3178C6"  opacity="0.04"/>
</svg>
